server {
    listen 8003;
    root /usr/share/nginx/html;

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok","service":"ops-ui"}';
    }

    # 시연 중 고친 파일이 바로 보이도록 캐시하지 않음
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
