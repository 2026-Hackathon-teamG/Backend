server {
    listen 8003;
    root /usr/share/nginx/html;

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok","service":"ops-ui"}';
    }

    # /api/state, /api/control은 detector로 넘김. 실행 시점에 찾으므로 detector가 없어도 화면은 뜸(목업으로 대체)
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 2s;
    set $detector http://detector:8002;

    location /api/ {
        proxy_pass $detector;
    }

    # 시연 중 고친 파일이 바로 보이도록 캐시하지 않음
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
