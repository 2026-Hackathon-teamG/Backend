server {
    listen 8005;
    root /usr/share/nginx/html;

    # compose 안의 bank 서비스. 실행 시점에 찾으므로 bank가 없어도 화면은 뜸
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 2s;
    set $bank http://bank:8001;

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok","service":"bank-ui"}';
    }

    # 은행 API와 공격 경로는 Django로 넘김
    location /api/ {
        proxy_pass $bank;
    }

    location ~ ^/(robots\.txt|admin-old|health)$ {
        proxy_pass $bank;
    }

    # 시연 중 고친 파일이 바로 보이도록 캐시하지 않음
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-store";
    }

    # ops-ui와 달리 메인으로 되돌리지 않음. 없는 경로는 404여야 미끼 판정이 맞음
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
